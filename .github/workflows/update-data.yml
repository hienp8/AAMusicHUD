name: Update traffic data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch camera and speed-limit data from OpenStreetMap
        shell: bash
        run: |
          mkdir -p data
          UA="AAMusicHud-data/1.0 (https://github.com/hienp8/AAMusicHUD)"
          fetch() {
            for m in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              for try in 1 2; do
                if curl -sS --fail --max-time 240 -A "$UA" --data-urlencode "data=$1" "$m" -o "$2.raw"; then
                  awk -F, 'NF>=2 { ms=$3; if (ms !~ /^[0-9]+$/) ms=""; print $1","$2","ms }' "$2.raw" > "$2.tmp"
                  if [ -s "$2.tmp" ]; then mv "$2.tmp" "$2"; rm -f "$2.raw"; return 0; fi
                fi
                sleep 10
              done
            done
            return 1
          }
          Q1='[out:csv(::lat,::lon,"maxspeed";false;",")][timeout:200];area["ISO3166-1"="VN"][admin_level=2]->.a;(node["highway"="speed_camera"](area.a);node["enforcement"="maxspeed"](area.a););out;'
          Q2='[out:csv(::lat,::lon,"maxspeed";false;",")][timeout:200];area["ISO3166-1"="VN"][admin_level=2]->.a;node["traffic_sign"="maxspeed"]["maxspeed"](area.a);out;'
          fetch "$Q1" data/vn_cameras.csv || echo "cameras: failed"
          fetch "$Q2" data/vn_signs.csv || echo "signs: failed"
          wc -l data/vn_*.csv || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/vn_cameras.csv data/vn_signs.csv || true
          git diff --cached --quiet || git commit -m "Update traffic data from OpenStreetMap"
          git push
