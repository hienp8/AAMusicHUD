name: Build AA Music

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: grep -E "^e: |What went wrong|error:|Could not resolve" -A4 build.log | head -100

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AA Music.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AA-Music
          path: out/AA Music.apk
