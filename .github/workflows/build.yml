name: Build AA Music

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        run: |
          for i in 1 2 3; do
            if gradle assembleRelease --no-daemon --console=plain; then exit 0; fi
            echo "Build loi, thu lai sau 40 giay (lan $i)"
            sleep 40
          done
          exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AA Music.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AA-Music
          path: out/AA Music.apk
